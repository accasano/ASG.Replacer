<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Replacer</title>

   <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.otstrap-icons.css" rel="stylesheet">

    <style>
        body{
            background:#eef2f7;
        }

        .main-card{
            border:none;
            border-radius:12px;
        }

        .rule-card{
            background:#fff;
            border:1px solid #dee2e6;
            border-radius:12px;
            padding:12px;
            margin-bottom:10px;
        }

		#rules{
			height:200px;
			overflow-y:auto;
			overflow-x:hidden;
			border:1px solid #dee2e6;
			border-radius:12px;
			padding:10px;
			background:#f8f9fa;
		}

        textarea{
            min-height:300px;
            font-family:Consolas, monospace;
        }

        .btn{
            border-radius:10px;
        }

        .card-header{
            border-radius:5px 5px 0 0 !important;
        }
    </style>
</head>

<body>

<div class="container py-4">

    <div class="card shadow">

        <div class="card-header bg-primary text-white">
            <h3 class="mb-0">
                <i class="bi bi-arrow-left-right"></i>
                Text Replacer
            </h3>
        </div>

        <div class="card-body">

            <div class="d-flex flex-wrap gap-2 mb-4">

                <button onclick="addRule()" class="btn btn-success">
                    <i class="bi bi-plus-circle"></i>
                    Add Rule
                </button>

                <button onclick="saveRulesLocal()" class="btn btn-primary">
                    <i class="bi bi-save"></i>
                    Save
                </button>

                <button onclick="loadRulesLocal()" class="btn btn-secondary">
                    <i class="bi bi-folder2-open"></i>
                    Load
                </button>

                <button onclick="exportRules()" class="btn btn-info text-white">
                    <i class="bi bi-download"></i>
                    Export
                </button>

                <label class="btn btn-warning mb-0">
                    <i class="bi bi-upload"></i>
                    Import
                    <input
                        type="file"
                        id="importFile"
                        accept=".json"
                        onchange="importRules(event)"
                        hidden>
                </label>

            </div>

            <h5 class="mb-3">
                <i class="bi bi-list-check"></i>
                Replacement Rules
            </h5>

            <div id="rules" class="mb-4"></div>

            <div class="row g-4">

                <div class="col-lg-6">

                    <label class="form-label fw-bold">
                        Input Text
                    </label>

                    <textarea
                        id="inputText"
                        class="form-control"
                        rows="12"
                        placeholder="Paste your text here..."></textarea>

                </div>

                <div class="col-lg-6">

                    <label class="form-label fw-bold">
                        Output Text
                    </label>

                    <textarea
                        id="outputText"
                        class="form-control"
                        rows="12"
                        readonly
                        placeholder="Resulting text..."></textarea>

                </div>

            </div>

            <div class="mt-4 d-flex flex-wrap align-items-center gap-3">

                <button onclick="applyReplacements()" class="btn btn-danger btn-lg">
                    <i class="bi bi-magic"></i>
                    Replace Text
                </button>

                <span id="counter" class="badge bg-success fs-6"></span>

            </div>

        </div>

    </div>

</div>

<script>

function addRule(find = "", replace = "") {

    const container = document.getElementById("rules");

    const div = document.createElement("div");
    div.className = "rule-row";

    div.innerHTML = `
        <div class="row g-2 align-items-center">

            <div class="col-md-5">
                <input
                    type="text"
                    class="form-control find"
                    placeholder="Text to replace"
                    value="${find}">
            </div>

            <div class="col-md-5">
                <input
                    type="text"
                    class="form-control replace"
                    placeholder="Replace with"
                    value="${replace}">
            </div>

            <div class="col-md-2">
                <button
                    onclick="deleteRule(this)"
                    class="btn btn-outline-danger w-100">
                    <i class="bi bi-trash">Remove</i>
                </button>
            </div>

        </div>
    `;

    container.appendChild(div);
}

function deleteRule(button) {
    button.closest(".rule-row").remove();
}

function applyReplacements() {

    let text = document.getElementById("inputText").value;

    const findInputs = document.querySelectorAll(".find");
    const replaceInputs = document.querySelectorAll(".replace");

    let totalReplacements = 0;

    for (let i = 0; i < findInputs.length; i++) {

        const find = findInputs[i].value;
        const replace = replaceInputs[i].value;

        if (find) {

            const regex = new RegExp(
                find.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"),
                "g"
            );

            const matches = (text.match(regex) || []).length;

            text = text.replace(regex, replace);

            totalReplacements += matches;
        }
    }

    text = text
        .split("\n")
        .map(line => line.replace(/\s+$/g, ""))
        .join("\n");

    document.getElementById("outputText").value = text;

    document.getElementById("counter").textContent =
        `${totalReplacements} replacements made`;
}

function saveRulesLocal() {

    const findInputs = document.querySelectorAll(".find");
    const replaceInputs = document.querySelectorAll(".replace");

    const rules = [];

    for (let i = 0; i < findInputs.length; i++) {
        rules.push({
            find: findInputs[i].value,
            replace: replaceInputs[i].value
        });
    }

    localStorage.setItem(
        "replacementRules",
        JSON.stringify(rules)
    );

    alert("Rules saved.");
}

function loadRulesLocal() {

    const savedRules =
        localStorage.getItem("replacementRules");

    if (!savedRules) {
        alert("No saved rules found.");
        return;
    }

    const rules = JSON.parse(savedRules);

    document.getElementById("rules").innerHTML = "";

    rules.forEach(r =>
        addRule(r.find, r.replace)
    );
}

function exportRules() {

    const findInputs = document.querySelectorAll(".find");
    const replaceInputs = document.querySelectorAll(".replace");

    const rules = [];

    for (let i = 0; i < findInputs.length; i++) {

        rules.push({
            find: findInputs[i].value,
            replace: replaceInputs[i].value
        });
    }

    const blob = new Blob(
        [JSON.stringify(rules, null, 2)],
        { type: "application/json" }
    );

    const url = URL.createObjectURL(blob);

    const a = document.createElement("a");

    a.href = url;
    a.download = "rules.json";
    a.click();

    URL.revokeObjectURL(url);
}

function importRules(event) {

    const file = event.target.files[0];

    if (!file) return;

    const reader = new FileReader();

    reader.onload = function(e) {

        try {

            const rules =
                JSON.parse(e.target.result);

            document.getElementById("rules").innerHTML = "";

            rules.forEach(r =>
                addRule(r.find, r.replace)
            );

            alert("Rules imported.");

        } catch {

            alert("Invalid JSON file.");
        }
    };

    reader.readAsText(file);
}

window.onload = function() {

    const saved =
        localStorage.getItem("replacementRules");

    if (saved) {

        JSON.parse(saved).forEach(r =>
            addRule(r.find, r.replace)
        );

    } else {

        addRule("—", ", ");
        addRule("–", "-");
        addRule("`", "'");
        addRule("´", "'");
        addRule("’", "'");
        addRule("  ", " ");
        addRule("á", "a");
        addRule("é", "e");
        addRule("í", "i");
        addRule("ó", "o");
        addRule("ú", "u");
		addRule("Á", "A");
        addRule("É", "E");
        addRule("Í", "I");
        addRule("Ó", "O");
        addRule("Ú", "U");		
    }
};

</script>

</body>
</html>
